<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Ronda — Prototipo</title>
<meta name="description" content="Prototipo jugable de Ronda: todo se vence a la hora de la ronda, una sola notificación por día, fotos de una vez y audios que salen como video.">
<meta name="theme-color" content="#151219">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@500&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* ---------------------------------------------------------------
   Ronda — prototipo
   La pantalla del teléfono vive siempre en oscuro: es la app.
   El marco de alrededor sigue el tema de quien mira.
   --------------------------------------------------------------- */
:root{
  --page:#EFECE6; --page-2:#E3DFD7; --page-ink:#1B1720; --page-ink-2:#6A6272;
  --page-line:#D3CEC4;
  color-scheme:light;

  --bg:#151219;
  --surface:#1E1A24;
  --raised:#2A2533;
  --line:#342E3F;
  --line-soft:#272231;
  --ink:#F4F0EA;
  --ink-2:#B3A8BE;
  --ink-3:#7C7189;
  --accent:#F2793D;
  --on-accent:#1E0B02;
  --teal:#6FD0C0;
  --fuego:#FFB23D;
  --bubble:#2A2533;
  --danger:#F4586B;
  --note:#FFD66B;
  --note-ink:#332600;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --page:#100E14; --page-2:#191520; --page-ink:#EDE8F0; --page-ink-2:#9A90A6;
    --page-line:#2A2432;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --page:#100E14; --page-2:#191520; --page-ink:#EDE8F0; --page-ink-2:#9A90A6;
  --page-line:#2A2432;
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--page); color:var(--page-ink);
  font-family:"Instrument Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:15px; line-height:1.45; -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ---------- barra de control (fuera del teléfono) ---------- */
.bar{
  position:fixed; inset:0 0 auto 0; z-index:50;
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:8px 16px; padding-top:calc(8px + env(safe-area-inset-top,0px));
  background:var(--page); border-bottom:1px solid var(--page-line);
}
.bar b{font-family:"Familjen Grotesk",sans-serif;font-weight:700;font-size:15px;letter-spacing:-.01em}
.bar .tag{
  font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:10px; font-weight:500;
  letter-spacing:.12em; text-transform:uppercase; color:var(--page-ink-2);
}
.bar .acts{display:flex;gap:6px}
.bar button{
  padding:5px 11px; border-radius:999px; border:1px solid var(--page-line);
  font-size:12.5px; font-weight:500; color:var(--page-ink-2); background:var(--page-2);
}
.bar button:hover{color:var(--page-ink)}
.bar button[aria-pressed="true"]{background:var(--note);border-color:var(--note);color:var(--note-ink)}
@media (max-width:460px){ .bar .tag{display:none} }

/* ---------- teléfono ---------- */
.stage{
  height:100%; display:flex; align-items:center; justify-content:center;
  padding:calc(54px + env(safe-area-inset-top,0px)) 16px 16px;
}
.device{
  position:relative; overflow:hidden;
  width:min(390px,100%); height:min(820px,100%);
  background:var(--bg); color:var(--ink);
  border-radius:38px; border:1px solid var(--page-line);
  box-shadow:0 30px 70px -30px rgba(0,0,0,.55), 0 2px 8px rgba(0,0,0,.12);
}
@media (max-width:760px){
  .stage{padding:calc(46px + env(safe-area-inset-top,0px)) 0 0}
  .device{width:100%;height:100%;border-radius:0;border:0;box-shadow:none}
}

.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.pad{padding:0 20px}

h1,h2,h3{font-family:"Familjen Grotesk","Instrument Sans",sans-serif;margin:0;letter-spacing:-.02em;text-wrap:balance}
h1{font-size:30px;font-weight:700;line-height:1.08}
h2{font-size:21px;font-weight:700;line-height:1.15}
p{margin:0}
.dim{color:var(--ink-2)}
.dim3{color:var(--ink-3)}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10.5px;font-weight:500;letter-spacing:.13em;text-transform:uppercase}
.col{display:flex;flex-direction:column}
.g6{gap:6px}.g10{gap:10px}.g14{gap:14px}.g20{gap:20px}

.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;padding:15px 18px;border-radius:15px;
  background:var(--accent);color:var(--on-accent);font-weight:600;font-size:15.5px;
  transition:transform .12s ease, filter .12s ease;
}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:scale(.985)}
.btn.ghost{background:var(--raised);color:var(--ink)}

.field{display:flex;flex-direction:column;gap:7px}
.field label{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.inp{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 15px}
.inp:focus-within{border-color:var(--accent)}
.inp span{color:var(--ink-3);font-weight:600}
.inp input{flex:1;min-width:0;background:none;border:0;color:var(--ink);font-size:16px;font-weight:500;outline:none}
.inp input::placeholder{color:var(--ink-3)}
.hint{font-size:12.5px;color:var(--ink-3);line-height:1.4}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  padding:8px 13px;border-radius:999px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink-2);font-size:13.5px;font-weight:500;
  transition:background .12s ease,color .12s ease,border-color .12s ease;
}
.chip[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:#0B211D}
.chip.flat{background:transparent}
.chip.flat[aria-pressed="true"]{background:var(--raised);border-color:var(--raised);color:var(--ink)}

.mark{width:48px;height:48px;border-radius:50%;border:3px solid var(--accent);position:relative;flex:none}
.mark::after{content:"";position:absolute;width:11px;height:11px;border-radius:50%;background:var(--teal);right:-4px;bottom:4px}

.av{width:44px;height:44px;border-radius:15px;flex:none;display:flex;align-items:center;justify-content:center;
    font-family:"Familjen Grotesk",sans-serif;font-weight:700;font-size:16px;color:#14101A}
.av.sm{width:26px;height:26px;border-radius:9px;font-size:11px}

/* ---------- encabezado ---------- */
.head{display:flex;align-items:center;gap:12px;padding:14px 16px 12px;border-bottom:1px solid var(--line-soft);background:var(--bg)}
.head .back{font-size:22px;line-height:1;color:var(--ink-2);padding:2px 4px}
.head .ttl{flex:1;min-width:0}
.head .ttl b{display:block;font-family:"Familjen Grotesk",sans-serif;font-size:17px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.head .ttl small{display:block;font-size:12px;color:var(--ink-3)}

/* franja del vencimiento — el motor del producto, siempre visible */
.cierra{
  display:flex;align-items:center;gap:10px;padding:9px 16px;
  background:var(--surface);border-bottom:1px solid var(--line-soft);font-size:12.5px;
}
.cierra .fuego{color:var(--fuego);font-weight:600;flex:none}
.cierra .reloj{color:var(--accent);font-weight:600;font-variant-numeric:tabular-nums}
.cierra .cupo{margin-left:auto;color:var(--ink-3);flex:none}

/* ---------- bandeja ---------- */
.filters{display:flex;gap:7px;padding:12px 16px 6px}
.row{display:flex;gap:12px;padding:12px 16px;align-items:center;width:100%;text-align:left;border-bottom:1px solid var(--line-soft)}
.row:hover{background:var(--surface)}
.row .mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row .top{display:flex;align-items:baseline;gap:8px}
.row .top b{font-size:15.5px;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .top .meta{font-size:11.5px;color:var(--fuego);flex:none;font-weight:600}
.row .prev{font-size:13.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .prev i{font-style:normal;color:var(--teal)}
.row .cd{font-size:11.5px;color:var(--ink-3);flex:none}

/* ---------- temas ---------- */
.temas{display:flex;gap:6px;padding:10px 16px;overflow-x:auto;border-bottom:1px solid var(--line-soft);scrollbar-width:none}
.temas::-webkit-scrollbar{display:none}
.tema{flex:none;padding:7px 12px;border-radius:10px;font-size:13.5px;font-weight:500;color:var(--ink-3);position:relative;white-space:nowrap}
.tema[aria-selected="true"]{background:var(--raised);color:var(--ink)}
.tema em{position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:50%;background:var(--accent)}

/* ---------- conversación ---------- */
.msgs{display:flex;flex-direction:column;gap:3px;padding:14px 14px 18px}
.msg{max-width:84%;display:flex;flex-direction:column;gap:3px;align-self:flex-start}
.msg.me{align-self:flex-end;align-items:flex-end}
.msg + .msg.start{margin-top:11px}
.who{font-size:11.5px;font-weight:600;padding-left:12px}
.bub{background:var(--bubble);border-radius:17px 17px 17px 6px;padding:9px 13px 8px;font-size:15px;line-height:1.38;cursor:pointer;position:relative}
.msg.me .bub{background:var(--accent);color:var(--on-accent);border-radius:17px 17px 6px 17px}
.msg:not(.start) .bub{border-radius:17px}
.meta{display:flex;align-items:center;gap:6px;justify-content:flex-end;margin-top:5px;font-size:10.5px;opacity:.55;line-height:1}
.meta.pv{opacity:.95;color:var(--fuego)}
.msg.me .meta.pv{color:var(--on-accent);opacity:.8}
.meta .pin{opacity:1}
.guardado .bub{box-shadow:inset 0 0 0 1.5px var(--teal)}
.sello{font-size:11px;color:var(--teal);padding-left:10px}
.msg.me .sello{padding:0 10px 0 0}
.quote{border-left:2.5px solid var(--teal);padding:2px 0 2px 8px;margin-bottom:5px;font-size:13px;line-height:1.3;opacity:.8}
.quote b{display:block;font-size:12px;color:var(--teal)}
.msg.me .quote{border-color:var(--on-accent);opacity:.65}
.msg.me .quote b{color:var(--on-accent)}
.sys{align-self:center;max-width:90%;text-align:center;font-size:12px;color:var(--ink-3);padding:7px 12px;background:var(--surface);border-radius:10px;margin:8px 0}
.reacts{display:flex;gap:4px;margin-top:-2px;padding-left:8px}
.msg.me .reacts{padding:0 8px 0 0}
.reacts span{background:var(--raised);border:1px solid var(--line);border-radius:999px;padding:1px 7px;font-size:12px}

/* audio */
.audio{display:flex;align-items:center;gap:11px;min-width:212px}
.play{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;flex:none;font-size:12px}
.msg.me .play{background:rgba(0,0,0,.16)}
.wave{flex:1;display:flex;align-items:center;gap:2px;height:26px}
.wave i{flex:1;background:currentColor;opacity:.3;border-radius:2px;transition:opacity .15s ease}
.wave i.on{opacity:.95}
.spd{font-size:11px;font-weight:700;padding:3px 6px;border-radius:7px;background:rgba(255,255,255,.12);flex:none}
.msg.me .spd{background:rgba(0,0,0,.16)}
.tr{margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.14);font-size:13.5px;line-height:1.45}
.msg.me .tr{border-color:rgba(0,0,0,.18)}
.tr .cue{cursor:pointer;border-radius:3px}
.tr .cue:hover{background:rgba(255,255,255,.14)}
.aacts{display:flex;gap:14px;margin-top:8px;font-size:11.5px;font-weight:600;opacity:.65}

/* foto de una sola vez */
.foto{display:flex;align-items:center;gap:10px;min-width:180px;font-size:14px;font-weight:500}
.foto .ic{width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;flex:none;font-size:13px}
.foto.vista{opacity:.45;font-weight:400}

/* tarjeta de tiktok */
.card{width:210px}
.card .thumb{height:104px;border-radius:12px;background:linear-gradient(140deg,#2A2533,#4A2140 60%,#123A3A);display:flex;align-items:center;justify-content:center;font-size:24px;margin-bottom:8px}
.card b{display:block;font-size:13.5px;font-weight:600;line-height:1.25}
.card small{font-size:11.5px;opacity:.6}

/* barra de acciones sobre un mensaje */
.rbar{
  position:absolute;z-index:8;display:flex;align-items:center;gap:2px;padding:5px;
  background:var(--raised);border:1px solid var(--line);border-radius:999px;
  box-shadow:0 10px 26px -10px rgba(0,0,0,.7);
}
.rbar button{padding:4px 6px;font-size:18px;line-height:1;border-radius:999px}
.rbar button:hover{background:var(--surface)}
.rbar .sep{width:1px;height:20px;background:var(--line);margin:0 3px;flex:none}
.rbar .save{font-size:12px;font-weight:600;padding:5px 10px;color:var(--teal)}

/* ---------- escritura ---------- */
.compose{
  display:flex;gap:9px;align-items:center;padding:11px 14px;
  padding-bottom:calc(11px + env(safe-area-inset-bottom,0px));
  border-top:1px solid var(--line-soft);background:var(--bg);
}
.compose .box{flex:1;display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:9px 15px}
.compose input{flex:1;min-width:0;background:none;border:0;outline:none;color:var(--ink);font-size:16px}
.compose input::placeholder{color:var(--ink-3)}
.compose .adj{color:var(--ink-3);font-size:17px;flex:none}
.send{width:42px;height:42px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;flex:none;font-size:17px}

/* ---------- umbral ---------- */
.ring{position:relative;width:118px;height:118px;margin:0 auto}
.ring svg{transform:rotate(-90deg)}
.ring .n{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:"Familjen Grotesk",sans-serif}
.ring .n b{font-size:38px;font-weight:700;line-height:1}
.ring .n small{font-size:11px;color:var(--ink-3);letter-spacing:.06em}
.joins{display:flex;flex-direction:column;gap:9px}
.join{display:flex;align-items:center;gap:10px;font-size:14px;animation:pop .28s ease both}
.join .tick{color:var(--teal);font-size:12px;margin-left:auto}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.slot{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--ink-3)}
.slot .dot{width:26px;height:26px;border-radius:9px;border:1.5px dashed var(--line);flex:none}

/* ---------- ajustes ---------- */
.set{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line-soft);width:100%;text-align:left}
.set .mid{flex:1;min-width:0}
.set b{display:block;font-size:14.5px;font-weight:600}
.set small{display:block;font-size:12.5px;color:var(--ink-3);line-height:1.35}
.set.warn b{color:var(--danger)}
.sw{width:44px;height:26px;border-radius:999px;background:var(--raised);position:relative;flex:none;transition:background .15s ease}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--ink-3);transition:transform .15s ease,background .15s ease}
.sw[aria-pressed="true"]{background:rgba(111,208,192,.25)}
.sw[aria-pressed="true"]::after{transform:translateX(18px);background:var(--teal)}

/* ---------- capas ---------- */
.capa{position:absolute;inset:0;z-index:35;background:rgba(8,6,11,.94);display:flex;flex-direction:column;animation:fade .2s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.capa .x{position:absolute;top:14px;right:16px;font-size:20px;color:var(--ink-2);z-index:2}
.visor{flex:1;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#3A2140,#123A3A)}
.visor .n{font-family:"Familjen Grotesk",sans-serif;font-size:70px;font-weight:700;color:rgba(255,255,255,.18)}
.capa .barra{position:absolute;top:0;left:0;height:3px;background:var(--accent);transition:width 1s linear}
.capa .pie{padding:16px 20px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px}

/* exportar audio a video */
.video{
  width:min(210px,58%);aspect-ratio:9/16;margin:0 auto;border-radius:16px;position:relative;overflow:hidden;
  background:linear-gradient(165deg,#F2793D,#8E2B6B 55%,#16323C);display:flex;flex-direction:column;justify-content:flex-end;padding:14px;
}
.video .ondas{position:absolute;inset:auto 0 42%;display:flex;align-items:flex-end;gap:3px;height:56px;padding:0 14px}
.video .ondas i{flex:1;background:rgba(255,255,255,.85);border-radius:2px;animation:danza 1s ease-in-out infinite alternate}
@keyframes danza{from{height:15%}to{height:100%}}
.video .txt{font-size:12px;font-weight:600;line-height:1.3;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.4)}
.video .marca{position:absolute;top:12px;left:14px;font-family:"Familjen Grotesk",sans-serif;font-weight:700;font-size:12px;color:rgba(255,255,255,.9)}

/* notificación simulada */
.push{
  position:absolute;top:12px;left:12px;right:12px;z-index:45;
  background:rgba(42,37,51,.97);border:1px solid var(--line);border-radius:18px;padding:12px 14px;
  display:flex;gap:11px;align-items:flex-start;cursor:pointer;
  box-shadow:0 18px 40px -14px rgba(0,0,0,.8);animation:baja .3s cubic-bezier(.2,.9,.3,1.2) both;
}
@keyframes baja{from{opacity:0;transform:translateY(-70px)}to{opacity:1;transform:none}}
.push .ic{width:34px;height:34px;border-radius:10px;border:2px solid var(--accent);flex:none}
.push b{display:block;font-size:13.5px;font-weight:600}
.push p{font-size:12.5px;color:var(--ink-2);margin-top:2px;line-height:1.35}
.push .cuando{font-size:11px;color:var(--ink-3);flex:none}

/* ---------- torneo ---------- */
.banner{
  display:flex;align-items:center;gap:12px;margin:12px 16px 4px;padding:12px 14px;
  border-radius:16px;width:calc(100% - 32px);text-align:left;
  background:linear-gradient(120deg,rgba(242,121,61,.18),rgba(255,178,61,.10));
  border:1px solid rgba(242,121,61,.32);
}
.banner .llama{font-size:20px;flex:none}
.banner b{display:block;font-size:13.5px;font-weight:600}
.banner small{display:block;font-size:12px;color:var(--ink-3);line-height:1.3}
.banner .ir{color:var(--accent);font-size:18px;flex:none}

.pozo{
  margin:0 20px;padding:20px;border-radius:20px;text-align:center;
  background:linear-gradient(150deg,rgba(242,121,61,.22),rgba(111,208,192,.10));
  border:1px solid rgba(242,121,61,.3);
}
.pozo .mono{color:var(--ink-3)}
.pozo .plata{font-family:"Familjen Grotesk",sans-serif;font-size:40px;font-weight:700;line-height:1.05;margin:6px 0 2px;letter-spacing:-.03em}
.barrita{height:6px;border-radius:999px;background:rgba(255,255,255,.12);margin-top:14px;overflow:hidden}
.barrita i{display:block;height:100%;border-radius:999px;background:var(--accent);transition:width .4s ease}
.tabla{display:flex;flex-direction:column}
.fila{display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid var(--line-soft)}
.fila .pos{width:22px;font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-3);flex:none;text-align:right}
.fila .nom{flex:1;min-width:0;font-size:14.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fila .dias{font-size:13px;color:var(--fuego);font-weight:600;flex:none;font-variant-numeric:tabular-nums}
.fila.yo{background:rgba(242,121,61,.12)}
.fila.yo .nom{color:var(--accent);font-weight:600}
.regla{display:flex;gap:9px;align-items:flex-start;font-size:13.5px;color:var(--ink-2);line-height:1.4}
.regla span{color:var(--teal);flex:none}

/* ---------- notas ---------- */
.notes{
  position:absolute;left:12px;right:12px;bottom:12px;z-index:30;
  background:var(--note);color:var(--note-ink);border-radius:16px;padding:13px 15px;
  box-shadow:0 18px 40px -16px rgba(0,0,0,.7);animation:pop .25s ease both;
}
.notes .mono{color:rgba(51,38,0,.6)}
.notes p{font-size:13.5px;line-height:1.42;margin-top:5px}
.notes .x{position:absolute;top:8px;right:10px;font-size:15px;opacity:.5}

.toast{
  position:absolute;left:50%;bottom:86px;transform:translateX(-50%);z-index:40;
  background:var(--raised);border:1px solid var(--line);color:var(--ink);
  padding:9px 15px;border-radius:999px;font-size:13px;white-space:nowrap;max-width:88%;
  animation:pop .2s ease both;
}
</style>
</head>
<body>

<div class="bar">
  <div style="display:flex;align-items:center;gap:9px;min-width:0">
    <b>Ronda</b>
    <span class="tag">prototipo · fase 0</span>
  </div>
  <div class="acts">
    <button id="btn-push">Aviso</button>
    <button id="btn-notes" aria-pressed="false">Notas</button>
    <button id="btn-reset">Reiniciar</button>
  </div>
</div>

<div class="stage">
  <div class="device" id="device"></div>
</div>

<script>
"use strict";

/* =====================================================================
   Datos
   ===================================================================== */

const TEMAS_SUGERIDOS = ["general","previa","parcial","memes","fotos","fixture"];
const HORAS = ["21:00","22:00","23:00","00:00"];
const PALETA = ["#F2793D","#6FD0C0","#F4C24A","#C58BF2","#7FB4F5","#F4869B","#9BDB6C"];
const CUPO = 10;

const PERSONAS = {
  juli:  {n:"Juli",  u:"@juli",   c:0},
  fran:  {n:"Fran",  u:"@fran0",  c:1},
  mica:  {n:"Mica",  u:"@micaa",  c:2},
  nacho: {n:"Nacho", u:"@nachoo", c:3},
  tomi:  {n:"Tomi",  u:"@tomi",   c:4},
  caro:  {n:"Caro",  u:"@carop",  c:5},
  lu:    {n:"Lu",    u:"@lu",     c:6}
};

let S, convos;

function estadoInicial(){
  S = {
    pantalla:"splash",
    yo:{n:"Valen", u:"@valen"},
    convo:null, tema:null,
    filtro:"todo", notas:false,
    umbral:1,
    miRonda:{nombre:"", temas:["general"], hora:"22:00"},
    leido:true, escribiendo:false,
    /* segundos que faltan para que cierre la ronda, para el reloj de arriba */
    faltan: 64*60 + 12
  };
  convos = {};
  sembrar();
}

/* Cada mensaje lleva `vence`: minutos que le quedan antes de borrarse.
   Es lo primero que se ve y lo que define el producto. */
function sembrar(){
  convos["p:juli"] = {
    tipo:"priv", con:"juli", titulo:"Juli", sub:"@juli", hora:"22:00", racha:23, guardados:1,
    msgs:[
      {de:"juli", t:"che entrás hoy? mirá que a las 22 se borra todo", vence:181},
      {de:"yo",   t:"sí sí ya estoy", vence:174, react:{"🔥":1}},
      {de:"juli", tipo:"audio", dur:"1:12", vence:120,
        tr:"Bueno pero decile a Fran que entre porque tiene los apuntes y los está mandando por mail como un señor de cuarenta años."},
      {de:"yo",   t:"jajajaja se lo digo", vence:118},
      {de:"juli", tipo:"foto", vence:64},
      {de:"juli", t:"esto guardalo que es el único que salió bien", vence:64, guardado:"Valen"}
    ],
    cola:[
      "obvio que sí",
      "guardalo guardalo que si no se va",
      "che me quedan 3 guardados nada más",
      "a las 22 entro, no me dejes colgada"
    ]
  };

  convos["p:fran"] = {
    tipo:"priv", con:"fran", titulo:"Fran", sub:"@fran0", hora:"22:00", racha:5, guardados:0,
    msgs:[
      {de:"fran", t:"te paso el link del apunte, guardalo ya porque yo me olvido siempre", vence:95},
      {de:"yo",   t:"gracias rey", vence:92, react:{"💀":2}}
    ],
    cola:["listo","decime si lo guardaste","mañana te paso el resumen"]
  };

  convos["g:pibes"] = {
    tipo:"ronda", titulo:"Los pibes", miembros:7, hora:"22:00", racha:12, guardados:2,
    gente:["nacho","caro","tomi","lu"],
    temas:{
      general:[
        {de:"nacho", t:"previa en casa el sábado, avisen", vence:172},
        {de:"caro",  t:"yo voy pero salgo tarde del laburo", vence:168},
        {de:"tomi",  t:"paso a buscarte", vence:165, cita:{de:"Caro", t:"yo voy pero salgo tarde del laburo"}},
        {de:"caro",  tipo:"link", titulo:"el audio de nacho pero con música", autor:"@carop", vence:140},
        {de:"lu",    t:"NO PUEDO MÁS", vence:138, react:{"😂":4}}
      ],
      previa:[
        {de:"tomi",  t:"faltan dos para el jueves", vence:150},
        {de:"nacho", t:"yo juego", vence:148},
        {de:"lu",    tipo:"audio", dur:"0:38", vence:52,
          tr:"Che yo el jueves no puedo porque tengo el final, pero anoten que el otro jueves sí, y si consiguen cancha avisen antes de las seis."}
      ],
      memes:[
        {de:"caro", t:"no puedo creer que exista un grupo donde no está mi tía", vence:44},
        {de:"lu",   t:"el grupo de la familia quedó allá y allá se queda", vence:41, react:{"😂":4,"🙏":2}, guardado:"Tomi"}
      ]
    },
    cola:["jajaja tal cual","+1","dale avisame","guardá ese que me muero"]
  };
}

/* =====================================================================
   Utilidades
   ===================================================================== */

const $ = (s,r) => (r||document).querySelector(s);
const dev = () => document.getElementById("device");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function nombre(p){
  if(p && typeof p === "object") return p.n;
  if(p === "yo") return S.yo.n;
  return PERSONAS[p] ? PERSONAS[p].n : String(p || "?");
}
function color(p){
  if(p && typeof p === "object") return PALETA[p.c % PALETA.length];
  return PALETA[(PERSONAS[p] ? PERSONAS[p].c : 0) % PALETA.length];
}
function avatar(p, cls){
  return '<div class="av ' + (cls||"") + '" style="background:' + color(p) + '">' +
    esc(nombre(p).slice(0,1).toUpperCase()) + '</div>';
}
/* Las rondas toman color del largo de su nombre; los privados, el de la persona. */
function pinAv(c, quien){
  if(c.tipo === "priv") return quien || c.con;
  return { n: c.titulo, c: c.titulo.length };
}
function laClave(c){
  return Object.keys(convos).filter(k => convos[k] === c)[0] || null;
}
function toast(txt){
  const vieja = $(".toast"); if(vieja) vieja.remove();
  const el = document.createElement("div");
  el.className = "toast"; el.textContent = txt;
  dev().appendChild(el);
  setTimeout(() => el.remove(), 2100);
}

/* Cuánto le queda a un mensaje, en el formato más corto que se entienda. */
function queda(min){
  if(min == null) return "";
  if(min < 60) return min + " min";
  return Math.floor(min/60) + " h";
}
function relojLargo(seg){
  const h = Math.floor(seg/3600), m = Math.floor(seg%3600/60), s = seg%60;
  return h + ":" + String(m).padStart(2,"0") + ":" + String(s).padStart(2,"0");
}
/* "8 mensajes, 1 audio y 1 foto" — sin ceros y sin plurales de más.
   Es el texto de la única notificación del día: tiene que estar bien. */
function listaVence(v){
  const partes = [];
  if(v.n)      partes.push(v.n + (v.n === 1 ? " mensaje" : " mensajes"));
  if(v.audios) partes.push(v.audios + (v.audios === 1 ? " audio" : " audios"));
  if(v.fotos)  partes.push(v.fotos + (v.fotos === 1 ? " foto" : " fotos"));
  if(!partes.length) return "No queda nada sin guardar.";
  const total = v.n + v.audios + v.fotos;
  const ultima = partes.pop();
  const cuerpo = (partes.length ? partes.join(", ") + " y " : "") + ultima;
  return cuerpo + (total === 1 ? " se borra." : " se borran.");
}
function totalPorVencer(c){
  const arr = todosLosMsgs(c);
  let n = 0, fotos = 0, audios = 0;
  arr.forEach(m => {
    if(m.sys || m.guardado) return;
    if(m.tipo === "foto") fotos++; else if(m.tipo === "audio") audios++; else n++;
  });
  return { n, fotos, audios };
}
function todosLosMsgs(c){
  if(c.tipo !== "ronda") return c.msgs;
  return Object.keys(c.temas).reduce((a,t) => a.concat(c.temas[t]), []);
}

/* =====================================================================
   Notas del entrevistador — apagadas por default.
   La Fase 0 dice: mostrar el prototipo sin explicar nada.
   ===================================================================== */

const NOTAS = {
  splash:  ["Todo se vence","La promesa entera en la primera pantalla. Si no se entiende sola, el problema es de comunicación, no de idea."],
  alta:    ["Sos un @, no un número","Sin SMS obligatorio el costo por usuario se desploma, y podés hablar con alguien sin darle el teléfono."],
  ronda:   ["La hora de la ronda","No se vence a las 24 h de cada mensaje: cierra a una hora fija, la misma para todos. Así entran todos juntos y la app no se siente vacía."],
  umbral:  ["Se abre a los cinco","La traba es a propósito. El que llega solo a una app vacía se pierde igual; el umbral lo convierte en reclutador."],
  bandeja: ["Sin notificaciones","No hay globo rojo por un “jajaja”. La única notificación del día es una hora antes de que cierre. Probá el botón “Aviso” de arriba."],
  ronda_v: ["Guardar tiene cupo","Diez por ronda. Sin cupo la gente guarda todo y el producto vuelve a ser un archivo. Tocá un mensaje para guardarlo."],
  chat:    ["Lo que entra y lo que sale","Fotos de una sola vez, TikToks por el compartir del sistema, y el audio que se convierte en video vertical listo para subir — con la marca adentro. Ese es el motor de crecimiento."],
  torneo:  ["El pozo es un porcentaje","El 40% de lo que entró ese mes, no un monto fijo: así el premio nunca puede ser más grande que la plata que entró. Y el contador de cuánto falta para los US$ 10.000 convierte a cada suscriptor en alguien que quiere que entren más."],
  vos:     ["La pantalla más corta","Notificaciones tiene una sola línea y ningún interruptor. El día que aparezca un segundo tipo de aviso, Ronda se volvió lo que dijo que no era."]
};

function pintarNotas(){
  const vieja = $(".notes"); if(vieja) vieja.remove();
  const hueco = $(".hueco-nota"); if(hueco) hueco.remove();
  if(!S.notas) return;
  const n = NOTAS[S.pantalla]; if(!n) return;

  const el = document.createElement("div");
  el.className = "notes";
  el.innerHTML = '<button class="x" aria-label="Cerrar nota">✕</button>' +
    '<div class="mono">' + esc(n[0]) + '</div><p>' + esc(n[1]) + '</p>';
  el.querySelector(".x").onclick = () => { S.notas = false; sincNotas(); pintarNotas(); };
  dev().appendChild(el);

  const comp = $(".compose");
  el.style.bottom = (comp ? comp.offsetHeight + 10 : 12) + "px";
  const sc = $(".scroll");
  if(sc){
    const d = document.createElement("div");
    d.className = "hueco-nota";
    d.style.height = (el.offsetHeight + 20) + "px";
    d.setAttribute("aria-hidden","true");
    sc.appendChild(d);
    if(S.pantalla === "chat" || S.pantalla === "ronda_v") alFinal();
  }
}
function sincNotas(){
  document.getElementById("btn-notes").setAttribute("aria-pressed", S.notas ? "true" : "false");
}

/* =====================================================================
   Router
   ===================================================================== */

function ir(p){ S.pantalla = p; pintar(); }

function pintar(){
  const d = dev();
  const vistas = {
    splash:vSplash, alta:vAlta, ronda:vRonda, umbral:vUmbral,
    bandeja:vBandeja, ronda_v:vRondaVista, chat:vChat, vos:vVos, torneo:vTorneo
  };
  d.innerHTML = "";
  const s = document.createElement("section");
  s.className = "screen";
  d.appendChild(s);
  vistas[S.pantalla](s);
  pintarNotas();
}

/* El reloj de cierre corre solo, en un único intervalo para toda la app. */
setInterval(() => {
  if(S.faltan > 0) S.faltan--;
  const r = $(".reloj");
  if(r) r.textContent = relojLargo(S.faltan);
}, 1000);

/* =====================================================================
   1 · Bienvenida
   ===================================================================== */

function vSplash(s){
  s.innerHTML =
    '<div class="scroll pad col" style="gap:24px;padding-top:7%;padding-bottom:40px">' +
      '<div class="mark"></div>' +
      '<div class="col g14">' +
        '<h1>Hablás hoy.<br>Mañana no quedó nada.</h1>' +
        '<p class="dim" style="font-size:16px">Ronda cierra todos los días a la misma hora y se borra lo del día. Lo que querés que quede, lo guardás vos.</p>' +
      '</div>' +
      '<ul class="col g10" style="margin:0;padding:0;list-style:none">' +
        liPunto("Todo se vence a las 24 h, a una hora fija para todo el grupo") +
        liPunto("Una sola notificación por día: una hora antes de que cierre") +
        liPunto("Sos un @, no un número de teléfono") +
        liPunto("Fotos que se ven una vez. Audios que salen como video") +
      '</ul>' +
      '<button class="btn" id="go">Empezar</button>' +
      '<p class="hint" style="text-align:center">Prototipo. No guarda nada ni manda nada a ningún lado.</p>' +
    '</div>';
  $("#go", s).onclick = () => ir("alta");
}
function liPunto(t){
  return '<li style="display:flex;gap:10px;align-items:flex-start">' +
    '<span style="color:var(--teal);font-size:13px;line-height:1.5">◆</span>' +
    '<span class="dim" style="font-size:14.5px">' + esc(t) + '</span></li>';
}

/* =====================================================================
   2 · Alta con @
   ===================================================================== */

function vAlta(s){
  s.innerHTML =
    '<div class="head"><button class="back" id="b">‹</button><div class="ttl"><b>Tu cuenta</b></div></div>' +
    '<div class="scroll pad col g20" style="padding-top:22px;padding-bottom:22px">' +
      '<div class="field"><label for="f-user">Elegí tu usuario</label>' +
        '<div class="inp"><span>@</span><input id="f-user" value="valen" autocomplete="off" spellcheck="false" maxlength="16"></div>' +
        '<p class="hint">Es con esto que te encuentran. No se puede cambiar después.</p></div>' +
      '<div class="field"><label for="f-name">Cómo te van a ver</label>' +
        '<div class="inp"><input id="f-name" value="Valen" autocomplete="off" maxlength="24"></div></div>' +
      '<div class="field"><label for="f-nac">Fecha de nacimiento</label>' +
        '<div class="inp"><input id="f-nac" value="14/03/2005" inputmode="numeric" autocomplete="off"></div>' +
        '<p class="hint">Ronda es para mayores de 16. La fecha después no se edita sola: hay que pedirlo.</p></div>' +
      '<div style="background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:14px 15px">' +
        '<div class="mono" style="color:var(--teal)">No te pedimos</div>' +
        '<p class="dim" style="font-size:13.5px;margin-top:6px">Tu número de teléfono, tu agenda de contactos ni permiso para nada. El teléfono es opcional y sirve sólo para recuperar la cuenta.</p>' +
      '</div>' +
      '<button class="btn" id="go">Crear cuenta</button>' +
    '</div>';
  $("#b", s).onclick = () => ir("splash");
  $("#go", s).onclick = () => {
    const u = ($("#f-user", s).value || "vos").trim().replace(/[^a-z0-9_.]/gi,"").toLowerCase() || "vos";
    const n = ($("#f-name", s).value || "Vos").trim() || "Vos";
    S.yo = { n:n, u:"@" + u };
    ir("ronda");
  };
}

/* =====================================================================
   3 · Crear la ronda, con su hora de cierre
   ===================================================================== */

function vRonda(s){
  const sel = S.miRonda.temas;
  s.innerHTML =
    '<div class="head"><button class="back" id="b">‹</button><div class="ttl"><b>Tu primera ronda</b></div></div>' +
    '<div class="scroll pad col g20" style="padding-top:22px;padding-bottom:22px">' +
      '<div class="col g6"><h2>¿Con quiénes hablás todos los días?</h2>' +
      '<p class="dim" style="font-size:14.5px">Una ronda es tu grupo. Tiene temas adentro y una hora a la que cierra.</p></div>' +
      '<div class="field"><label for="f-r">Nombre de la ronda</label>' +
        '<div class="inp"><input id="f-r" placeholder="Los pibes" value="' + esc(S.miRonda.nombre) + '" maxlength="28" autocomplete="off"></div></div>' +
      '<div class="field"><label>Temas adentro</label>' +
        '<div class="chips" id="temas">' +
          TEMAS_SUGERIDOS.map(t =>
            '<button class="chip" data-t="' + t + '" aria-pressed="' + (sel.indexOf(t) >= 0) + '">#' + t + '</button>'
          ).join("") +
        '</div></div>' +
      '<div class="field"><label>¿A qué hora cierra?</label>' +
        '<div class="chips" id="horas">' +
          HORAS.map(h =>
            '<button class="chip" data-h="' + h + '" aria-pressed="' + (S.miRonda.hora === h) + '">' + h + '</button>'
          ).join("") +
        '</div>' +
        '<p class="hint">Todos los días a esa hora se borra lo del día, para todos al mismo tiempo. Una hora antes, la app avisa.</p></div>' +
      '<button class="btn" id="go">Crear la ronda</button>' +
    '</div>';

  $("#b", s).onclick = () => ir("alta");
  $("#temas", s).onclick = e => {
    const b = e.target.closest("[data-t]"); if(!b) return;
    const t = b.dataset.t, i = sel.indexOf(t);
    if(i >= 0){ if(sel.length > 1) sel.splice(i,1); else return toast("Una ronda necesita al menos un tema"); }
    else sel.push(t);
    b.setAttribute("aria-pressed", sel.indexOf(t) >= 0);
  };
  $("#horas", s).onclick = e => {
    const b = e.target.closest("[data-h]"); if(!b) return;
    S.miRonda.hora = b.dataset.h;
    s.querySelectorAll("[data-h]").forEach(x => x.setAttribute("aria-pressed", x.dataset.h === S.miRonda.hora));
  };
  $("#go", s).onclick = () => {
    S.miRonda.nombre = ($("#f-r", s).value || "").trim() || "Mi ronda";
    ir("umbral");
  };
}

/* =====================================================================
   4 · El umbral de cinco
   ===================================================================== */

const ENTRAN = ["juli","fran","mica","nacho"];
let timerUmbral = null;

function vUmbral(s){
  const faltan = Math.max(0, 5 - S.umbral);
  const listo = faltan === 0;
  const pct = S.umbral / 5;
  const C = 2 * Math.PI * 52;

  s.innerHTML =
    '<div class="head"><div class="ttl"><b>' + esc(S.miRonda.nombre) + '</b><small>' +
      S.miRonda.temas.map(t => "#" + t).join("  ") + ' · cierra ' + esc(S.miRonda.hora) + '</small></div></div>' +
    '<div class="scroll pad col g20" style="padding-top:26px;padding-bottom:22px">' +
      '<div class="ring"><svg width="118" height="118" aria-hidden="true">' +
        '<circle cx="59" cy="59" r="52" fill="none" stroke="var(--line)" stroke-width="7"></circle>' +
        '<circle cx="59" cy="59" r="52" fill="none" stroke="' + (listo ? "var(--teal)" : "var(--accent)") + '" stroke-width="7"' +
        ' stroke-linecap="round" stroke-dasharray="' + C + '" stroke-dashoffset="' + (C*(1-pct)) + '"' +
        ' style="transition:stroke-dashoffset .45s ease"></circle>' +
      '</svg><div class="n"><b>' + S.umbral + '</b><small>DE 5</small></div></div>' +

      '<div class="col g6" style="text-align:center">' +
        (listo
          ? '<h2>Se abrió tu ronda.</h2><p class="dim">Ya son cinco. Cierra a las ' + esc(S.miRonda.hora) + '.</p>'
          : '<h2>Tu ronda se abre cuando entren 5.</h2><p class="dim">Faltan ' + faltan + '. Pasá el link.</p>') +
      '</div>' +

      '<div class="joins" id="joins"></div>' +

      (listo
        ? '<button class="btn" id="go">Entrar a la ronda</button>'
        : '<button class="btn" id="go">Pasar el link</button>' +
          '<p class="hint" style="text-align:center">El primer día la ronda no cierra: nadie pierde nada mientras entran.</p>') +
    '</div>';

  const dentro = ["yo"].concat(ENTRAN.slice(0, S.umbral - 1));
  $("#joins", s).innerHTML =
    dentro.map(p =>
      '<div class="join">' + avatar(p,"sm") + '<span>' + esc(nombre(p)) +
      (p === "yo" ? ' <span class="dim3">(vos)</span>' : '') + '</span><span class="tick">entró</span></div>'
    ).join("") +
    Array.from({length: Math.max(0, 5 - dentro.length)}, () =>
      '<div class="slot"><span class="dot"></span><span>esperando…</span></div>'
    ).join("");

  $("#go", s).onclick = () => {
    if(listo){ crearMiRonda(); abrirConvo("g:mia", S.miRonda.temas[0]); return; }
    toast("Link copiado");
    clearInterval(timerUmbral);
    timerUmbral = setInterval(() => {
      S.umbral++;
      if(S.umbral >= 5){ clearInterval(timerUmbral); S.umbral = 5; }
      if(S.pantalla === "umbral") pintar(); else clearInterval(timerUmbral);
    }, 850);
  };
}

function crearMiRonda(){
  if(convos["g:mia"]) return;
  const temas = {};
  S.miRonda.temas.forEach((t,i) => {
    temas[t] = i === 0 ? [
      {sys:"Entraron Juli, Fran, Mica y Nacho. La ronda cierra a las " + S.miRonda.hora + "."},
      {sys:"Hoy no se borra nada: el primer día de una ronda no cierra."},
      {de:"juli",  t:"listo, ya estamos todos acá", vence:175},
      {de:"nacho", t:"me re gusta que no suene nada", vence:170},
      {de:"fran",  t:"ojo que a las " + S.miRonda.hora + " se borra todo eh", vence:166}
    ] : [];
  });
  convos["g:mia"] = {
    tipo:"ronda", titulo:S.miRonda.nombre, miembros:5, hora:S.miRonda.hora,
    racha:1, guardados:0, temas:temas, propia:true,
    gente:["juli","fran","mica","nacho"],
    cola:["jajaja","dale","+1","guardá ese"]
  };
}

/* =====================================================================
   5 · Bandeja
   ===================================================================== */

function temaActivo(c){
  return (c.ultimoTema && c.temas[c.ultimoTema]) ? c.ultimoTema : Object.keys(c.temas)[0];
}
function ultimo(c){
  const arr = c.tipo === "ronda" ? (c.temas[temaActivo(c)] || []) : c.msgs;
  for(let i = arr.length - 1; i >= 0; i--){
    const m = arr[i];
    if(m.sys) continue;
    const txt = m.tipo === "audio" ? "🎤 Audio · " + m.dur
              : m.tipo === "foto"  ? "📷 Foto"
              : m.tipo === "link"  ? "🎬 " + m.titulo
              : m.t;
    return { de:m.de, txt:txt, vence:m.vence, guardado:m.guardado };
  }
  return { de:null, txt:"Sin mensajes todavía" };
}

/* =====================================================================
   6 · Conversación
   ===================================================================== */

function abrirConvo(k, tema){
  S.convo = k;
  const c = convos[k];
  if(c.tipo === "ronda"){ S.tema = tema || temaActivo(c); ir("ronda_v"); }
  else { S.tema = null; ir("chat"); }
}
function vRondaVista(s){ vConversacion(s, true); }
function vChat(s){ vConversacion(s, false); }
function listaMsgs(c){ return c.tipo === "ronda" ? c.temas[S.tema] : c.msgs; }
function alFinal(){ const sc = $("#scr"); if(sc) sc.scrollTop = sc.scrollHeight; }

function vConversacion(s, esRonda){
  const c = convos[S.convo];
  const sub = esRonda ? c.miembros + " en la ronda" : c.sub;

  s.innerHTML =
    '<div class="head"><button class="back" id="b">‹</button>' +
      avatar(pinAv(c), "sm") +
      '<div class="ttl"><b>' + esc(c.titulo) + '</b><small>' + esc(sub) + '</small></div></div>' +
    '<div class="cierra"><span class="fuego">🔥 ' + c.racha + '</span>' +
      '<span>cierra ' + esc(c.hora) + ' · en</span><span class="reloj">' + relojLargo(S.faltan) + '</span>' +
      '<span class="cupo">guardados ' + c.guardados + '/' + CUPO + '</span></div>' +
    (esRonda ? '<div class="temas" id="temas" role="tablist">' +
      Object.keys(c.temas).map(t =>
        '<button class="tema" role="tab" data-t="' + esc(t) + '" aria-selected="' + (t === S.tema) + '">#' + esc(t) +
        (c.sinLeer && c.sinLeer[t] ? '<em></em>' : '') + '</button>'
      ).join("") +
      '<button class="tema" data-t="__nuevo" style="color:var(--teal)">+ tema</button></div>' : "") +
    '<div class="scroll" id="scr"><div class="msgs" id="msgs"></div></div>' +
    '<div class="compose"><div class="box">' +
      '<button class="adj" id="foto" aria-label="Mandar una foto de una sola vez">📷</button>' +
      '<input id="txt" placeholder="Escribí algo…" autocomplete="off">' +
    '</div><button class="send" id="send" aria-label="Enviar">↑</button></div>';

  $("#b", s).onclick = () => ir("bandeja");

  if(esRonda){
    $("#temas", s).onclick = e => {
      const b = e.target.closest("[data-t]"); if(!b) return;
      if(b.dataset.t === "__nuevo"){
        const n = prompt("Nombre del tema nuevo (sin #):", "");
        if(n){
          const clave = n.trim().toLowerCase().replace(/[^a-z0-9áéíóúñ]/gi,"").slice(0,14);
          if(clave && !c.temas[clave]){
            c.temas[clave] = [{sys:"Creaste el tema #" + clave + "."}];
            S.tema = clave; pintar();
          }
        }
        return;
      }
      if(c.sinLeer) delete c.sinLeer[b.dataset.t];
      S.tema = b.dataset.t; pintar();
    };
  }

  $("#foto", s).onclick = () => {
    listaMsgs(c).push({de:"yo", tipo:"foto", vence:Math.floor(S.faltan/60)});
    if(c.tipo === "ronda") c.ultimoTema = S.tema;
    pintarMsgs($("#msgs", s), c); alFinal();
    toast("Se ve una sola vez. No se puede guardar.");
  };

  const enviar = () => {
    const i = $("#txt", s), v = i.value.trim();
    if(!v) return;
    i.value = "";
    listaMsgs(c).push({de:"yo", t:v, vence:Math.floor(S.faltan/60)});
    if(c.tipo === "ronda") c.ultimoTema = S.tema;
    pintarMsgs($("#msgs", s), c); alFinal();
    responder(c);
  };
  $("#send", s).onclick = enviar;
  $("#txt", s).addEventListener("keydown", e => { if(e.key === "Enter") enviar(); });

  pintarMsgs($("#msgs", s), c);
  alFinal();
}

function responder(c){
  if(!c.cola || !c.cola.length) return;
  const arr = listaMsgs(c);
  const tema = S.tema;
  const gente = c.gente || [c.con];
  const quien = c.tipo === "priv" ? c.con : gente[Math.floor(Math.random()*gente.length)];
  const txt = c.cola.shift();
  c.cola.push(txt);
  setTimeout(() => {
    arr.push({de:quien, t:txt, vence:Math.floor(S.faltan/60)});
    if(c.tipo === "ronda") c.ultimoTema = tema;
    if((S.pantalla === "chat" || S.pantalla === "ronda_v") && S.convo === laClave(c)){
      const cont = $("#msgs"); if(cont){ pintarMsgs(cont, c); alFinal(); }
    } else if(c.tipo === "ronda"){
      c.sinLeer = c.sinLeer || {}; c.sinLeer[tema] = true;
    }
  }, 700 + Math.random()*700);
}

/* =====================================================================
   Pintar mensajes
   ===================================================================== */

function pintarMsgs(cont, c){
  const arr = listaMsgs(c) || [];
  let prev = null;
  cont.innerHTML = arr.map((m, i) => {
    if(m.sys){ prev = null; return '<div class="sys">' + esc(m.sys) + '</div>'; }
    const mio = m.de === "yo";
    const start = prev !== m.de;
    prev = m.de;
    const cls = "msg" + (mio ? " me" : "") + (start ? " start" : "") + (m.guardado ? " guardado" : "");
    const who = (!mio && c.tipo === "ronda" && start)
      ? '<span class="who" style="color:' + color(m.de) + '">' + esc(nombre(m.de)) + '</span>' : "";
    const sello = m.guardado ? '<span class="sello">📌 guardado por ' + esc(m.guardado) + '</span>' : "";
    const reacts = m.react
      ? '<div class="reacts">' + Object.keys(m.react).map(e =>
          '<span>' + e + " " + m.react[e] + '</span>').join("") + '</div>' : "";
    return '<div class="' + cls + '" data-i="' + i + '">' + who + cuerpo(m) + sello + reacts + '</div>';
  }).join("");

  cont.onclick = e => {
    const cue = e.target.closest(".cue");     if(cue){ saltarAudio(cue); return; }
    const btn = e.target.closest("[data-acc]");
    const msgEl = e.target.closest(".msg");
    const m = msgEl ? arr[+msgEl.dataset.i] : null;
    if(btn){ accionMensaje(btn, m, c); return; }
    if(msgEl) barraAcciones(msgEl, m, c);
  };
}

/* La cuenta regresiva va en cada mensaje: es lo que define el producto. */
function marca(m){
  if(m.guardado) return '<div class="meta"><span class="pin">📌</span> no se borra</div>';
  if(m.vence == null) return "";
  const urgente = m.vence < 60;
  return '<div class="meta' + (urgente ? " pv" : "") + '">' +
    (urgente ? "⏳ " : "") + "se va en " + queda(m.vence) + '</div>';
}

function cuerpo(m){
  if(m.tipo === "audio"){
    return '<div class="bub">' +
      '<div class="audio">' +
        '<button class="play" data-acc="play" aria-label="Reproducir">▶</button>' +
        '<div class="wave">' + Array.from({length:24}, (_,k) =>
          '<i style="height:' + (22 + Math.sin(k*1.7)*14 + (k%4)*7) + '%"></i>').join("") + '</div>' +
        '<span style="font-size:11.5px;opacity:.6">' + esc(m.dur) + '</span>' +
        '<button class="spd" data-acc="spd">1×</button>' +
      '</div>' +
      '<div class="aacts"><button data-acc="tr">▾ Transcripción</button>' +
        '<button data-acc="video">🎬 Hacer video</button></div>' +
      '<div class="tr" hidden>' + m.tr.split(" ").map(w =>
        '<span class="cue">' + esc(w) + '</span>').join(" ") + '</div>' +
      marca(m) + '</div>';
  }
  if(m.tipo === "foto"){
    return '<div class="bub"><div class="foto' + (m.vista ? " vista" : "") + '" data-acc="foto">' +
      '<span class="ic">' + (m.vista ? "◍" : "📷") + '</span>' +
      '<span>' + (m.vista ? "Foto vista" : "Foto · tocá para verla") + '</span></div>' +
      (m.vista ? '<div class="meta">no vuelve</div>' : marca(m)) + '</div>';
  }
  if(m.tipo === "link"){
    return '<div class="bub"><div class="card" data-acc="link">' +
      '<div class="thumb">🎬</div><b>' + esc(m.titulo) + '</b>' +
      '<small>TikTok · ' + esc(m.autor) + '</small></div>' + marca(m) + '</div>';
  }
  const cita = m.cita ? '<div class="quote"><b>' + esc(m.cita.de) + '</b>' + esc(m.cita.t) + '</div>' : "";
  return '<div class="bub">' + cita + esc(m.t) + marca(m) + '</div>';
}

/* =====================================================================
   Acciones sobre un mensaje
   ===================================================================== */

const reproduciendo = new WeakMap();

function accionMensaje(btn, m, c){
  const bub = btn.closest(".bub");
  const a = btn.dataset.acc;

  if(a === "tr"){
    const tr = bub.querySelector(".tr");
    tr.hidden = !tr.hidden;
    btn.textContent = (tr.hidden ? "▾" : "▴") + " Transcripción";
    return;
  }
  if(a === "spd"){
    btn.textContent = { "1×":"1,5×", "1,5×":"2×", "2×":"1×" }[btn.textContent] || "1×";
    return;
  }
  if(a === "video"){ capaVideo(m); return; }
  if(a === "link"){ toast("Abre TikTok. Llegó por el compartir del sistema."); return; }
  if(a === "foto"){
    if(m.vista) return toast("Ya la viste. Las fotos no vuelven.");
    capaFoto(m, c);
    return;
  }

  // play / pausa
  const barras = bub.querySelectorAll(".wave i");
  const activo = reproduciendo.get(bub);
  if(activo){ clearInterval(activo); reproduciendo.delete(bub); btn.textContent = "▶"; return; }
  btn.textContent = "❚❚";
  const vel = { "1×":1, "1,5×":1.5, "2×":2 }[bub.querySelector(".spd").textContent] || 1;
  let k = 0;
  const id = setInterval(() => {
    barras.forEach((b,j) => b.classList.toggle("on", j <= k));
    k++;
    if(k > barras.length){
      clearInterval(id); reproduciendo.delete(bub);
      btn.textContent = "▶";
      barras.forEach(b => b.classList.remove("on"));
    }
  }, 150/vel);
  reproduciendo.set(bub, id);
}

/* Tocar una palabra de la transcripción salta el audio a esa parte. */
function saltarAudio(cue){
  const bub = cue.closest(".bub");
  const palabras = Array.from(bub.querySelectorAll(".cue"));
  const barras = bub.querySelectorAll(".wave i");
  const pos = Math.floor(palabras.indexOf(cue) / palabras.length * barras.length);
  barras.forEach((b,j) => b.classList.toggle("on", j <= pos));
  toast("Salta a esa parte del audio");
}

/* Reacciones y guardar, en la misma barra. */
function barraAcciones(msgEl, m, c){
  if(!m || m.sys) return;
  const vieja = $(".rbar");
  if(vieja){ const mismo = vieja.dataset.i === msgEl.dataset.i; vieja.remove(); if(mismo) return; }

  const puedeGuardar = m.tipo !== "foto";
  const bar = document.createElement("div");
  bar.className = "rbar"; bar.dataset.i = msgEl.dataset.i;
  bar.innerHTML = ["😂","🔥","❤️","😭"].map(e => '<button data-e="' + e + '">' + e + '</button>').join("") +
    (puedeGuardar
      ? '<span class="sep"></span><button class="save" data-g="1">' + (m.guardado ? "Soltar" : "📌 Guardar") + '</button>'
      : '');

  const d = dev().getBoundingClientRect(), r = msgEl.getBoundingClientRect();
  bar.style.top = Math.max(8, r.top - d.top - 48) + "px";
  bar.style.left = Math.min(Math.max(8, r.left - d.left), d.width - (puedeGuardar ? 262 : 160)) + "px";
  dev().appendChild(bar);

  bar.onclick = e => {
    const g = e.target.closest("[data-g]");
    if(g){
      if(m.guardado){
        m.guardado = null; c.guardados = Math.max(0, c.guardados - 1);
        toast("Soltado. Se borra a las " + c.hora + ".");
      } else if(c.guardados >= CUPO){
        toast("Cupo lleno: " + CUPO + " guardados. Soltá uno.");
        bar.remove(); return;
      } else {
        m.guardado = S.yo.n; c.guardados++;
        toast("Guardado. Te quedan " + (CUPO - c.guardados) + ".");
      }
      bar.remove(); pintar(); alFinal(); return;
    }
    const b = e.target.closest("[data-e]"); if(!b) return;
    m.react = m.react || {};
    m.react[b.dataset.e] = (m.react[b.dataset.e] || 0) + 1;
    bar.remove();
    pintarMsgs($("#msgs"), c);
  };

  setTimeout(() => {
    document.addEventListener("click", function fuera(ev){
      if(!bar.contains(ev.target)){ bar.remove(); document.removeEventListener("click", fuera); }
    });
  }, 0);
}

   Capas: foto de una vez, exportar audio a video, notificación

function capa(html){
  const vieja = $(".capa"); if(vieja) vieja.remove();
  const el = document.createElement("div");
  el.className = "capa";
  el.innerHTML = '<button class="x" aria-label="Cerrar">✕</button>' + html;
  el.querySelector(".x").onclick = () => el.remove();
  dev().appendChild(el);
  return el;
}

function capaFoto(m, c){
  const el = capa(
    '<div class="barra" style="width:100%"></div>' +
    '<div class="visor"><span class="n">1×</span></div>' +
    '<div class="pie"><p class="dim" style="font-size:13.5px">Se cierra sola y no vuelve. ' +
    'Si sacás captura, se avisa en la conversación.</p></div>');
  const barra = el.querySelector(".barra");
  let seg = 5;
  const t = setInterval(() => {

/* =====================================================================
   7 · Torneo — el pozo es un porcentaje de lo que entró, no un premio fijo
   ===================================================================== */

/* El pozo es un porcentaje de lo que entró, no un monto fijo: por eso no
   puede quebrar al proyecto. A 210.000 suscriptores da US$ 10.000 por grupo. */
const SUSCRIPTORES = 96400, NETO = 1.20, PARTE = 0.40, GRUPOS = 10, META_GRUPO = 10000;
function pozo(){ return Math.round(SUSCRIPTORES * NETO * PARTE); }
function porGrupo(){ return Math.round(pozo() / GRUPOS); }
function faltanSuscriptores(){
  return Math.max(0, Math.ceil(META_GRUPO * GRUPOS / (NETO * PARTE)) - SUSCRIPTORES);
}
const mil = n => n.toLocaleString("es-AR");

const RIVALES = [
  {n:"Sistemas 2do turno noche", d:31},
  {n:"las nenas", d:29},
  {n:"Club Atlético Sarmiento", d:27},
  {n:"la previa", d:24},
  {n:"Arqui UNLP", d:22},
  {n:"los del fondo", d:19}
];

function vTorneo(s){
  crearMiRonda();
  const mia = convos["g:mia"], pibes = convos["g:pibes"];
  const tabla = RIVALES
    .concat([{n:pibes.titulo, d:pibes.racha}, {n:mia.titulo, d:mia.racha, yo:true}])
    .sort((a,b) => b.d - a.d);
  const puesto = tabla.findIndex(r => r.yo) + 1;
  const porCabeza = Math.round(porGrupo() / 10);
  const pct = Math.min(100, Math.round(porGrupo() / META_GRUPO * 100));

  s.innerHTML =
    '<div class="head"><button class="back" id="b">‹</button>' +
      '<div class="ttl"><b>Torneo de septiembre</b><small>quedan 8 días</small></div></div>' +
    '<div class="scroll col g20" style="padding:20px 0 24px">' +

      '<div class="pozo">' +
        '<div class="mono">Premio de este mes, por grupo</div>' +
        '<div class="plata">US$ ' + mil(porGrupo()) + '</div>' +
        '<p class="dim" style="font-size:13px">US$ ' + mil(porCabeza) + ' por cabeza. ' +
        'Ganan los 10 grupos que más hablaron.</p>' +
        '<div class="barrita"><i style="width:' + pct + '%"></i></div>' +
        '<p class="hint" style="margin-top:8px">El pozo es el <b style="color:var(--ink-2)">40% de lo que entra</b>. ' +
        'Faltan <b style="color:var(--accent)">' + mil(faltanSuscriptores()) + ' suscriptores</b> para que sean US$ ' +
        mil(META_GRUPO) + ' por grupo.</p>' +
      '</div>' +

      '<div class="col g6" style="padding:0 20px">' +
        '<div class="mono" style="color:var(--ink-3)">El objetivo</div>' +
        '<p class="dim" style="font-size:14.5px"><b style="color:var(--ink)">30.000 mensajes válidos en 10 días.</b> ' +
        'Son 300 por persona por día. Clasifican todos los que lo superen; ganan los 10 con más.</p></div>' +

      '<div class="col g10" style="padding:0 20px">' +
        regla("Participar es gratis. Ronda+ da stickers, nunca ventaja.") +
        regla("Los 10 días tienen que ser válidos: 5 personas, 20 mensajes cada una.") +
        regla("Mensaje válido: 4 palabras o más, sin repetir ninguno de los últimos 20.") +
        regla("Una persona compite en una sola ronda por mes.") +
        regla("De 14 y 15 se juega y se aparece en la tabla, pero sin premio en efectivo.") +
      '</div>' +

      '<div class="col">' +
        '<div class="mono" style="padding:0 20px 8px;color:var(--ink-3)">Tabla · días válidos</div>' +
        '<div class="tabla">' +
          tabla.map((r,i) =>
            '<div class="fila' + (r.yo ? " yo" : "") + '"><span class="pos">' + (i+1) + '</span>' +
            '<span class="nom">' + esc(r.n) + (r.yo ? " · vos" : "") + '</span>' +
            '<span class="dias">🔥 ' + r.d + '</span></div>'
          ).join("") +
        '</div>' +
      '</div>' +

      '<p class="hint" style="padding:0 20px">Vas ' + puesto + '.ª con ' + mia.racha +
        (mia.racha === 1 ? " día válido" : " días válidos") + '. Un día no cuenta si no hablaron cinco.</p>' +
    '</div>';

  $("#b", s).onclick = () => ir("bandeja");
}
function regla(t){
  return '<div class="regla"><span>◆</span><span style="color:var(--ink-2)">' + esc(t) + '</span></div>';
}

/* =====================================================================
   8 · Vos
   ===================================================================== */

function vVos(s){
  const guardados = Object.keys(convos).reduce((a,k) => a + (convos[k].guardados || 0), 0);
  s.innerHTML =
    '<div class="head"><button class="back" id="b">‹</button><div class="ttl"><b>Vos</b></div></div>' +
    '<div class="scroll">' +
      '<div class="col g10" style="align-items:center;padding:26px 20px 22px">' +
        '<div class="av" style="width:74px;height:74px;border-radius:26px;font-size:28px;background:' + color("yo") + '">' +
          esc(S.yo.n.slice(0,1).toUpperCase()) + '</div>' +
        '<div class="col g6" style="align-items:center">' +
          '<h2>' + esc(S.yo.n) + '</h2>' +
          '<span class="mono" style="color:var(--teal)">' + esc(S.yo.u) + '</span></div>' +
        '<p class="hint" style="text-align:center;max-width:30ch">Nadie te puede buscar por nombre. Te encuentran si les diste tu @ o el link de tu ronda.</p>' +
      '</div>' +

      seccion("Notificaciones") +
      '<div style="padding:4px 16px 16px"><p class="dim" style="font-size:14px;line-height:1.45">' +
        '<b style="color:var(--ink)">Ronda te avisa una vez por día</b>, una hora antes de que cierre tu ronda. ' +
        'Nada más. No te avisamos mensajes nuevos.</p>' +
        '<p class="hint" style="margin-top:8px">No hay nada que configurar acá. Es así para todos.</p></div>' +

      seccion("Lo que guardaste") +
      fila("Guardados", guardados + " en total. El cupo es de " + CUPO + " por ronda.") +
      fila("Rachas", "Se pueden pausar. Faltar un día por semana no la rompe.") +

      seccion("Privacidad") +
      fila("Tilde de leído", "Si lo apagás, dejás de ver el de los demás. Va para los dos lados.", "leido", S.leido) +
      fila("Mostrar “escribiendo…”", "Apagado. Si lo prendés, lo ves y te ven.", "escribiendo", S.escribiendo) +
      fila("Teléfono", "No cargado. Es opcional y sirve sólo para recuperar la cuenta.") +
      '<div style="padding:12px 16px"><p class="hint">No existe “en línea” ni “últ. vez” en Ronda. No están apagados: no están.</p></div>' +

      seccion("Seguridad") +
      fila("Bloqueados", "Ninguno todavía.") +
      fila("Reportar a alguien", "Lo que reportás deja de vencerse y lo lee una persona. Respuesta en menos de 24 horas.") +

      seccion("Tus datos") +
      fila("Exportar lo guardado", "Es lo único que existe: no hay historial que exportar.") +
      '<button class="set warn" id="borrar"><div class="mid"><b>Borrar mi cuenta</b>' +
        '<small>Desde acá, sin mandar un mail ni hablar con nadie.</small></div></button>' +

      '<p class="hint" style="padding:18px 16px 26px">Ronda es para mayores de 16. Hoy hay cifrado en tránsito y en reposo, no de punta a punta: eso llega en la Fase 4 y hasta entonces no lo decimos.</p>' +
    '</div>';

  $("#b", s).onclick = () => ir("bandeja");
  s.querySelectorAll("[data-sw]").forEach(el => {
    const alternar = () => { S[el.dataset.sw] = !S[el.dataset.sw]; pintar(); };
    el.onclick = alternar;
    el.onkeydown = e => { if(e.key === "Enter" || e.key === " "){ e.preventDefault(); alternar(); } };
  });
  $("#borrar", s).onclick = () => toast("En la app de verdad: se borra y se acabó");
}
function seccion(t){
  return '<div class="mono" style="padding:20px 16px 8px;color:var(--ink-3)">' + esc(t) + '</div>';
}
/* Con `clave` la fila es un interruptor sobre S[clave]; sin ella, un ítem. */
function fila(b, sm, clave, on){
  const ctrl = clave
    ? '<span class="sw" data-sw="' + clave + '" role="button" tabindex="0" aria-pressed="' + !!on + '"></span>'
    : '<span class="dim3" style="font-size:18px">›</span>';
  return '<div class="set"><div class="mid"><b>' + esc(b) + '</b><small>' + esc(sm) + '</small></div>' + ctrl + '</div>';
}

/* =====================================================================
   Arranque
   ===================================================================== */

document.getElementById("btn-notes").onclick = () => { S.notas = !S.notas; sincNotas(); pintarNotas(); };
document.getElementById("btn-push").onclick  = () => capaPush();
document.getElementById("btn-reset").onclick = () => {
  clearInterval(timerUmbral);
  const n = S.notas;
  estadoInicial(); S.notas = n; sincNotas(); pintar();
};

estadoInicial();
pintar();
</script>
</body>
</html>
